name: Keep Apps Script warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Data event sudah di Firestore. Hanya Login.gs yang masih memakai Apps Script.
      - name: Ping Login.gs (login)
        run: |
          curl -sS -o /dev/null -w "Login.gs -> HTTP %{http_code}\n" \
            "${{ secrets.LOGIN_API_URL }}"
