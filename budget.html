<!doctype html>
<html lang="id">
<head>
<script src="js/auth-guard.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Budget — MAXIMUM THE ULTIMATE</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/budget.css" />
<link rel="stylesheet" href="css/feas.css" />
</head>
<body>
  <header class="topnav homebar">
    <a class="home-btn" href="index.html" aria-label="Kembali ke Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span>Home</span></a>
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2"/></svg>Budget</div>
    <div class="topnav-actions"><button type="button" class="theme-toggle" data-theme-toggle>🌙 Gelap</button></div>
  </header>

  <main class="budget-page">
    <div class="b-head">
      <div class="b-top">
        <div class="b-title"><label for="b-nama">Budget:</label><input id="b-nama" placeholder="Nama event" autocomplete="off"></div>
        <div class="b-row"><label class="b-k" for="b-venue">Venue:</label><input class="b-in" id="b-venue" placeholder="Nama venue" autocomplete="off"></div>
        <div class="b-row"><span class="b-k">Durasi:</span>
          <label for="b-gr">GR</label><input class="b-in num" id="b-gr" inputmode="numeric" placeholder="0"><span class="b-sd">hari</span>
          <label for="b-ev" style="margin-left:12px">Event</label><input class="b-in num" id="b-ev" inputmode="numeric" placeholder="0"><span class="b-sd">hari</span>
        </div>
      </div>
      <div class="b-actions noprint">
        <button class="ghost" id="b-reset" type="button">Kosongkan semua isian</button>
        <button class="primary" id="b-print" type="button">Cetak / Simpan PDF</button>
        <span class="b-status" id="b-status" role="status">Memuat database…</span>
      </div>
    </div>

    <div class="b-wrap"><table id="b-sheet">
      <colgroup><col class="c-no"><col><col class="c-ven"><col class="c-pcs"><col class="c-num"><col class="c-num"><col class="c-act noprint"></colgroup>
      <thead><tr><th class="c">No</th><th>Nama Barang</th><th>Vendor</th><th class="r">Pcs</th><th class="r">Harga satuan (Rp)</th><th class="r">Total (Rp)</th><th class="noprint"></th></tr></thead>
      <tfoot><tr class="grand"><td colspan="5">Total Keseluruhan</td><td class="n" id="b-grand">Rp 0</td><td class="noprint"></td></tr></tfoot>
    </table></div>
    <button class="b-addcat noprint" id="b-addcat" type="button">+ Tambah kategori</button>
    <div class="b-foot" id="b-foot"></div>
  </main>
  <ul class="b-list" id="b-list" role="listbox" hidden></ul>

  <script src="js/theme.js"></script>
  <script src="js/budget.js"></script>
</body>
</html>
