<!doctype html>
<html lang="id">
<head>
<script src="js/auth-guard.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://script.google.com" crossorigin />
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
<link rel="dns-prefetch" href="https://script.google.com" />
<link rel="dns-prefetch" href="https://script.googleusercontent.com" />
<title>Daftar Event — MAXIMUM THE ULTIMATE</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/loader.css" />
<link rel="stylesheet" href="css/events.css" />
<link rel="stylesheet" href="css/feas.css" />
</head>
<body>
  <header class="topnav homebar">
    <a class="home-btn" href="index.html" aria-label="Kembali ke Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span>Home</span></a>
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Daftar Event</div>
    <div class="topnav-actions"><button type="button" class="theme-toggle" data-theme-toggle>🌙 Gelap</button></div>
  </header>

  <main class="events-page">
    <div class="page-heading">
      <div class="eyebrow">DAFTAR EVENT</div>
      <h1>Semua laporan event yang tercatat</h1>
      <p>Cari event yang ingin diperbaiki — salah ketik, status DP yang perlu diubah jadi Lunas, atau detail lain — lalu klik <strong>Edit</strong> untuk membuka kembali form laporannya.</p>
    </div>

    <div class="events-toolbar">
      <input type="search" id="events-search" placeholder="Cari nama event, client, atau kota…" aria-label="Cari event" />
      <label class="events-sort">
        <span class="events-sort-label">Urutkan</span>
        <select id="events-sort" aria-label="Urutkan daftar event">
          <option value="updated-desc">Terakhir diperbarui (terbaru)</option>
          <option value="updated-asc">Terakhir diperbarui (terlama)</option>
          <option value="name-asc">Nama event A–Z</option>
          <option value="name-desc">Nama event Z–A</option>
        </select>
      </label>
      <div class="events-count" id="events-count"></div>
    </div>

    <div id="events-loading" class="mx-inline" data-mx-loader="Memuat Daftar Event"></div>
    <p class="events-error" id="events-error" role="alert" hidden></p>
    <p class="events-empty" id="events-empty" hidden>Belum ada event yang tercatat.</p>

    <div class="events-list" id="events-list" hidden></div>
  </main>

  <template id="event-row-template">
    <article class="event-row" data-event-row>
      <div class="event-row-main">
        <h3 class="event-row-title" data-event-name></h3>
        <div class="event-row-meta">
          <span data-event-client></span>
          <span class="dot">·</span>
          <span data-event-location></span>
          <span class="dot">·</span>
          <span class="event-row-price" data-event-price></span>
        </div>
        <div class="event-row-sub">
          <span>Tanggal event: <strong data-event-date></strong></span>
          <span>Disubmit: <strong data-event-submitted></strong></span>
          <span data-event-updated-wrap hidden>Diperbarui: <strong data-event-updated></strong></span>
          <span data-event-items></span>
        </div>
      </div>
      <div class="event-row-actions">
        <a class="btn-edit-event" data-event-edit-link href="#">Edit</a>
      </div>
    </article>
  </template>


  <script src="js/loader.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/data.js"></script>
  <script src="js/firebase-data.js"></script>
  <script src="js/outbox.js"></script>
  <script src="js/events.js"></script>
</body>
</html>
